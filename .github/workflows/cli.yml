name: cli

on:
  push:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
      - "package.json"
      - "cli/package.json"
      - "cli/internal/version/package.json"
      - "gui/**"
      - "npm/**"
      - "bin/**"
      - "scripts/sync-versions.mjs"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
      - "package.json"
      - "cli/package.json"
      - "cli/internal/version/package.json"
      - "gui/**"
      - "npm/**"
      - "bin/**"
      - "scripts/sync-versions.mjs"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: cli/go.sum

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y libicu-dev build-essential

      - name: golangci-lint
        # TODO: strict lint cleanup - 276 findings under v2.14
        continue-on-error: true
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: cli

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: versions:check
        run: node ../scripts/sync-versions.mjs --check

      - name: test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: build
        env:
          CGO_ENABLED: "1"
        run: go build -o /dev/null ./...
