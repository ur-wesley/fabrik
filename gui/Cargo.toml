[package]
name = "neon"
version = "2.0.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
eframe = { version = "0.36", features = ["glow", "wgpu"] }
egui-phosphor = "0.14"
egui_commonmark = "0.25"
notify = "8"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
egui_graphs = "0.32"
petgraph = "0.8"
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
raw-window-metal = "1.1"
window-vibrancy = "0.5"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"

[lints.rust]
dead_code = "deny"
unused = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
