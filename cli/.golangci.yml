version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print
        - pattern: ^panic$
    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 25
    govet:
      enable-all: true
    lll:
      line-length: 120
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - line: 500
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gochecknoglobals
          - gosec
          - nestif
          - unparam
      - path: internal/doltstore/store\.go|internal/mcpserver/handlers\.go|internal/initer/initer\.go|internal/reseter/reseter\.go
        linters:
          - revive
      - path: internal/initer/|internal/reseter/|internal/installer/|internal/selfupdate/|internal/migrater/|internal/download/|internal/updatedeps/|cmd/fabrik/show\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - nestif
          - maintidx
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/ur-wesley/fabrik
